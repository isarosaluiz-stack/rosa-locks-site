server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cache longo para imagens/fontes, cache curto para HTML
    location ~* \.(jpg|jpeg|png|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public";
    }

    # URLs sem .html (ex.: /projetos abre projetos.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
